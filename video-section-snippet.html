<!-- ===== 1) Replace the whole <div class="screen16" ...> ... </div> inside #video with this: ===== -->
<div class="screen16 has-video">
  <video src="chavruta-video.mp4" poster="chavruta-video-poster.jpg" preload="metadata" playsinline></video>
  <button class="vplay" type="button" aria-label="נגן את הסרטון"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l12.5-7.5z"></path></svg></button>
  <span class="vid-time num" aria-hidden="true">0:57</span>
</div>

<!-- ===== 2) Add to the site's <style>: ===== -->
<style>
.screen16.has-video video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#0D0C20}
.screen16.has-video .vplay{border:0;cursor:pointer;z-index:2}
.screen16.has-video .vid-time{z-index:2}
.screen16.has-video.playing .vplay,.screen16.has-video.playing .vid-time{display:none}
</style>

<!-- ===== 3) Add before </body>: ===== -->
<script>
(()=>{const s=document.querySelector('#video .screen16.has-video');if(!s)return;
 const v=s.querySelector('video'),b=s.querySelector('.vplay');
 b.addEventListener('click',()=>{s.classList.add('playing');v.controls=true;v.play();});
 v.addEventListener('ended',()=>{s.classList.remove('playing');v.controls=false;v.currentTime=0;});})();
</script>
<!-- Upload chavruta-video.mp4 and chavruta-video-poster.jpg next to index.html -->
